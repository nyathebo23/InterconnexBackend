<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>Malls.com</title>

    <style type="text/css">
        {

<body class="respond" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">
    <!-- pre-header -->
    <table style="display: none !important">
        <tr>
            <td>
                <div style="
              overflow: hidden;
              display: none;
              font-size: 1px;
              color: #ffffff;
              line-height: 1px;
              font-family: Arial;
              maxheight: 0px;
              max-width: 0px;
              opacity: 0;
            ">
                    Pre-header for the newsletter template
                </div>
            </td>
        </tr>
    </table>
    <!-- pre-header end -->
    <!-- header -->
    <table border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="ffffff">
        <tr>
            <td align="center">
                <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590">
                    <tr>
                        <td height="25" style="font-size: 25px; line-height: 25px">
                            &nbsp;
                        </td>
                    </tr>

                    <tr>
                        <td align="center">
                            <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590">
                                <tr>
                                    <td align="center" height="70" style="height: 70px">
                                        <a href="" style="
                          display: block;
                          border-style: none !important;
                          border: 0 !important;
                        "><img width="100" border="0" style="display: block; width: 100px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn%3AANd9GcQ7b7qOdLK1COrA8m3WVjkHpesNofcUJYCWcg&usqp=CAU" alt="Malls.com" /></a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td height="25" style="font-size: 25px; line-height: 25px">
                            &nbsp;
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <!-- end header -->

    <!-- main section -->

    <div class="main">
        {% block main %} {% endblock main %}
    </div>

    <!-- end main section -->

    <!-- contact section -->
    <table border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="ffffff" class="bg_color">
        <tr class="hide">
            <td height="25" style="font-size: 25px; line-height: 25px">&nbsp;</td>
        </tr>
        <tr>
            <td height="40" style="font-size: 40px; line-height: 40px">&nbsp;</td>
        </tr>

        <tr>
            <td height="60" style="
            border-top: 1px solid #e0e0e0;
            font-size: 60px;
            line-height: 60px;
          ">
                &nbsp;
            </td>
        </tr>

        <tr>
            <td align="center">
                <table border="0" align="center" width="590" cellpadding="0" cellspacing="0" class="container590 bg_color">
                    <tr>
                        <td>
                            <table border="0" width="300" align="left" cellpadding="0" cellspacing="0" style="
                    border-collapse: collapse;
                    mso-table-lspace: 0pt;
                    mso-table-rspace: 0pt;
                  " class="container590">
                                <tr>
                                    <!-- logo -->
                                    <td align="left">
                                        <a href="" style="
                          display: block;
                          border-style: none !important;
                          border: 0 !important;
                        "><img width="80" border="0" style="display: block;
                        width: 80px"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn%3AANd9GcQ7b7qOdLK1COrA8m3WVjkHpesNofcUJYCWcg&usqp=CAU

                      &nbsp;

                  </tr>

                  <tr>
                    <td
                      align="left"
                      style="
                        color: #888888;
                        font-size: 14px;
                        font-family: 'Work Sans', Calibri, sans-serif;
                        line-height: 23px;
                      "
                      class="text_color"
                    >
                      <div
                        style="
                          color: #333333;
                          font-size: 14px;
                          font-family: 'Work Sans', Calibri, sans-serif;
                          font-weight: 600;
                          mso-line-height-rule: exactly;
                          line-height: 23px;
                        "
                      >
                        Email us: <br />
                        <a
                          href="mailto:"
                          style="
                            color: #888888;
                            font-size: 14px;
                            font-family: 'Hind Siliguri', Calibri, Sans-serif;
                            font-weight: 400;
                          "
                          >wihgiv.dev@gmail.com</a
                        >
                      </div>
                    </td>
                  </tr>
                </table>

                <table
                  border="0"
                  width="2"
                  align="left"
                  cellpadding="0"
                  cellspacing="0"
                  style="
                    border-collapse: collapse;
                    mso-table-lspace: 0pt;
                    mso-table-rspace: 0pt;
                  "
                  class="container590"
                >
                  <tr>
                    <td
                      width="2"
                      height="10"
                      style="font-size: 10px; line-height: 10px"
                    ></td>
                  </tr>
                </table>

                <table
                  border="0"
                  width="200"
                  align="right"
                  cellpadding="0"
                  cellspacing="0"
                  style="
                    border-collapse: collapse;
                    mso-table-lspace: 0pt;
                    mso-table-rspace: 0pt;
                  "
                  class="container590"
                >
                  <tr>
                    <td
                      class="hide"
                      height="45"
                      style="font-size: 45px; line-height: 45px"
                    >
                      &nbsp;
                    </td>
                  </tr>

                  <tr>
                    <td height="15" style="font-size: 15px; line-height: 15px">
                      &nbsp;
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <table
                        border="0"
                        align="right"
                        cellpadding="0"
                        cellspacing="0"
                      >
                        <tr>
                          <td>
                            <a
                              href="https://www.facebook.com/malls"
                              style="
                                display: block;
                                border-style: none !important;
                                border: 0 !important;
                              "
                              ><img
                                width="24"
                                border="0"
                                style="display: block"
                                src="http://i.imgur.com/Qc3zTxn.png"
                                alt=""
                            /></a>
                                    </td>
                                    <td>&nbsp;&nbsp;&nbsp;&nbsp;</td>
                                    <td>
                                        <a href="https://twitter.com/malls" style="

                                display: block;
                                border-style: none !important;
                                border: 0 !important;
                              "><img width="24" border="0" style="display: block" src="http://i.imgur.com/Wji3af6.png" alt="" /></a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    </td>
    </tr>

    <tr>
        <td height="60" style="font-size: 60px; line-height: 60px">&nbsp;</td>
    </tr>
    </table>
    <!-- end section -->

    <!-- footer ====== -->
    <table border="0" width="100%" cellpadding="0" cellspacing="0" bgcolor="f4f4f4">
        <tr>
            <td height="25" style="font-size: 25px; line-height: 25px">&nbsp;</td>
        </tr>

        <tr>
            <td height="25" style="font-size: 25px; line-height: 25px">&nbsp;</td>
        </tr>
    </table>
